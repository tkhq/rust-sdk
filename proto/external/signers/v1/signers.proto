syntax = "proto3";

package external.signers.v1;

import "immutable/activity/v1/activity.proto";
import "immutable/models/v1/models.proto";
import "vendor/google/api/field_behavior.proto";
import "vendor/protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/tkhq/mono/src/go/gen/pkg/external/signers/v1";

// proof payload for external signer consumption
message ExternalSignerProof {
  ExternalSignerProofPayloadV1 payload = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "ExternalSignerPayloadV1."}
  ];
  immutable.models.v1.Signature signature = 2;
}

message ExternalSignerProofPayloadV1 {
  // The intent
  immutable.activity.v1.Intent intent = 1;
  // Used to verify recency requirements
  // This timestamp is in ms, in UTC. It comes directly from the NSM.
  uint64 timestamp = 2;
  // Hash of the organization data
  string organization_digest = 3;
  // The UUID of the organization
  string organization_id = 4;
  // The public key of the external signer
  string external_signer_pubkey = 5;
  // Task UUID generated by Ump
  string task_id = 6;
}
