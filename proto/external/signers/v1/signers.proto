syntax = "proto3";

package external.signers.v1;

import "immutable/activity/v1/activity.proto";
import "immutable/common/v1/common.proto";
import "immutable/models/v1/models.proto";
import "vendor/google/api/field_behavior.proto";
import "vendor/protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/tkhq/mono/src/go/gen/pkg/external/signers/v1";

// proof payload for external signer consumption
message ExternalSignerProof {
  ExternalSignerProofPayloadV1 payload = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "ExternalSignerPayloadV1."}
  ];
  immutable.models.v1.Signature signature = 2;
}

message ExternalSignerProofPayloadV1 {
  // The intent
  immutable.activity.v1.Intent intent = 1;
  // Used to verify recency requirements
  // This timestamp is in ms, in UTC. It comes directly from the NSM.
  uint64 timestamp = 2;
  // Hash of the organization data
  string organization_digest = 3;
  // The UUID of the organization
  string organization_id = 4;
  // The public key of the external signer
  string external_signer_pubkey = 5;
  // Task UUID generated by Ump
  string task_id = 6;
  // The Ethereum transaction Ump approved, set for Ethereum send transaction activities
  ExternalSignerEthTransaction eth_transaction = 7;
  // The Solana message Ump approved, set for Solana send transaction activities whose message was reconstructed
  ExternalSignerSolanaTransaction solana_transaction = 8;
}

// Ethereum transaction constructed by the parser and approved by Ump
message ExternalSignerEthTransaction {
  // The unsigned transaction to sign
  string constructed_transaction = 1;
}

// Solana message constructed by the parser and approved by Ump
message ExternalSignerSolanaTransaction {
  // Hex-encoded Solana message bytes to sign
  string constructed_message = 1;
  // Fee payer used for construction
  string fee_payer = 2;
  // Recent blockhash used for construction
  string recent_blockhash = 3;
}

// Versioned daemon record. Signatures use TK_SIGNED_BLOB_P256 over the domain prefix and original
// protobuf bytes, not a re-encoding. Signature.message carries hex of those original record bytes.
// Before signing, the daemon must verify record organization_id == proof organization_id,
// record external_signer_public_key == self, and proof signWith is the record key ID or an address.
message ExternalSignerKeyRecord {
  oneof body {
    ExternalSignerKeyRecordV1 external_signer_key_record_v1 = 1;
  }
}

message ExternalSignerKeyRecordV1 {
  string organization_id = 1;
  string private_key_id = 2;
  string external_signer_public_key = 3;
  immutable.common.v1.Curve curve = 4;
  string public_key = 5;
  repeated ExternalSignerKeyAddress addresses = 6;
  string wrapping_key_id = 7;
  string wrapped_private_key = 8;
}

message ExternalSignerKeyAddress {
  immutable.common.v1.AddressFormat format = 1;
  string address = 2;
}
