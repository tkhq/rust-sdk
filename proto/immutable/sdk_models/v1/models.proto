syntax = "proto3";

package immutable.sdk_models.v1;

import "immutable/activity/v1/activity.proto";
import "vendor/google/api/field_behavior.proto";
import "vendor/protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/tkhq/mono/src/go/gen/pkg/immutable/sdk_models/v1";

enum UsageType {
  USAGE_TYPE_UNSPECIFIED = 0;
  USAGE_TYPE_SIGNUP = 1;
  USAGE_TYPE_LOGIN = 2;
}

message TokenUsage {
  UsageType type = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Type of token usage"}
  ];
  string token_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Unique identifier for the verification token"}
  ];
  oneof usage {
    SignupUsage signup = 3;
    LoginUsage login = 4;
    SignupUsageV2 signup_v2 = 5;
    LoginUsageV2 login_v2 = 6;
    SignupUsageV3 signup_v3 = 7;
  }
}

message SignupUsage {
  optional string email = 1;
  optional string phone_number = 2;
  repeated immutable.activity.v1.ApiKeyParamsV2 api_keys = 3;
  repeated immutable.activity.v1.AuthenticatorParamsV2 authenticators = 4;
  repeated immutable.activity.v1.OauthProviderParams oauth_providers = 5;
}

message SignupUsageV2 {
  optional string email = 1;
  optional string phone_number = 2;
  repeated immutable.activity.v1.ApiKeyParamsV2 api_keys = 3;
  repeated immutable.activity.v1.AuthenticatorParamsV2 authenticators = 4;
  repeated immutable.activity.v1.OauthProviderParamsV2 oauth_providers = 5;
}

message LoginUsage {
  string public_key = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Public key for authentication"}
  ];
}

message LoginUsageV2 {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string public_key = 2 [(google.api.field_behavior) = REQUIRED];
  optional bool invalidate_existing = 3;
  optional string expiration_seconds = 4;
  optional string session_profile_id = 5;
}

message SignupUsageV3 {
  string parent_organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string sub_organization_name = 2 [(google.api.field_behavior) = REQUIRED];
  repeated immutable.activity.v1.RootUserParamsV5 root_users = 3 [(google.api.field_behavior) = REQUIRED];
  int32 root_quorum_threshold = 4 [(google.api.field_behavior) = REQUIRED];
  optional immutable.activity.v1.WalletParams wallet = 5;
  optional bool disable_email_recovery = 6;
  optional bool disable_email_auth = 7;
  optional bool disable_sms_auth = 8;
  optional bool disable_otp_email_auth = 9;
}
