[package]
name = "turnkey_jwt_profiles"
version = "0.17.1"
edition = "2024"
license = "Apache-2.0"
description = "Verify Turnkey JWT profiles, such as http-authz/v1 request-bound JWTs"
repository = "https://github.com/tkhq/rust-sdk"
homepage = "https://turnkey.com"
readme = "README.md"
documentation = "https://docs.rs/turnkey_jwt_profiles"
keywords = ["turnkey", "jwt", "authorization", "http", "p256"]
categories = ["cryptography", "authentication", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http-authz"]
# The http-authz/v1 profile: the verifier and the request binding helpers.
http-authz = ["dep:http", "dep:serde", "dep:serde_json"]
# The Axum route layer for verification.
axum = ["http-authz", "dep:axum", "dep:http-body-util", "dep:tower", "dep:tracing"]

[dependencies]
turnkey_jwt_verify.workspace = true

base64.workspace = true
http = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true

axum = { workspace = true, features = ["json", "original-uri"], optional = true }
http-body-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
http-body.workspace = true
p256.workspace = true
rand_core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
