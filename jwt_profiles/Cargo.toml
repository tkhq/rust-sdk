[package]
name = "turnkey_jwt_profiles"
version = "0.16.0"
edition = "2024"
license = "Apache-2.0"
description = "Verify Turnkey JWT profiles, such as http-authz/v1 request-bound JWTs"
repository = "https://github.com/tkhq/rust-sdk"
homepage = "https://turnkey.com"
readme = "README.md"
documentation = "https://docs.rs/turnkey_jwt_profiles"
keywords = ["turnkey", "jwt", "authorization", "http", "p256"]
categories = ["cryptography", "authentication", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http-authz"]
# The http-authz/v1 profile: the verifier and the request binding helpers.
http-authz = ["dep:base64", "dep:http", "dep:serde", "dep:serde_json", "dep:sha2"]
# The Axum route layer for http-authz/v1. Without it, the profile depends on
# `http` but not on Axum.
axum = ["http-authz", "dep:axum", "dep:tower", "dep:tracing"]

[dependencies]
turnkey_jwt_verify.workspace = true

base64 = { workspace = true, optional = true }
# The workspace `http` dependency is 0.2 (used by `turnkey_client`). This crate
# uses the 1.x types that hyper and Axum expose.
http = { version = "1.3", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

axum = { version = "0.8", default-features = false, features = ["json", "original-uri"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true
http-body = "1"
p256.workspace = true
rand_core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[[example]]
name = "verify_tokens"
path = "examples/verify_tokens.rs"
required-features = ["http-authz"]
