name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout PR code (if PR)
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: checkout pushed code (if push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy,rustfmt
      - name: install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "21.4"
      - name: install PC/SC headers (linked by the yubikey crate)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Ensure checked-in client is up-to-date
        run: make check-generate
      - name: Run linters
        run: make lint
      - name: Run tests
        run: make test
      - name: Run examples
        env:
          TURNKEY_ORGANIZATION_ID: 651b573c-861b-4f10-a478-cbcfe0c226af
          TURNKEY_API_PUBLIC_KEY: 0243df9d55fa88cd80b4ab3698e64f42389d6be75a477e3dd47eeb2826c22aa7b6
          TURNKEY_API_PRIVATE_KEY: ${{ secrets.TURNKEY_API_PRIVATE_KEY }}
        run: make examples
