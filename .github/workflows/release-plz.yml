name: Release-plz

permissions:
  pull-requests: write
  issues: write # needed for labels
  contents: write

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # crates.io trusted publishing must require this environment. Its only
    # protection is a `main` branch policy; there are no required reviewers,
    # so the review gate is the merge of the labelled PR.
    environment: release
    # only trigger this job if the push to main is from a merged PR with a "release" label
    if: >
      github.repository_owner == 'tkhq' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    permissions:
      contents: write
      # Required for trusted publishing, see https://release-plz.dev/docs/github/quickstart#2-set-the-cargo_registry_token-secret
      id-token: write
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # release from the latest commit of the release PR.
          fetch-depth: 0
      # A merged PR's run checks out the tip of main when the job starts, not
      # the PR's merge commit. Refuse to publish if anything else landed since.
      - name: Verify main is the release PR merge commit
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          if [[ "${head_sha}" != "${MERGE_COMMIT_SHA}" ]]; then
            echo "main is at ${head_sha}, not the release PR merge commit ${MERGE_COMMIT_SHA}" >&2
            exit 1
          fi
      - name: install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: install PC/SC headers (linked by the yubikey crate)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Run release-plz
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip PRs closed without merging: their runs check out unmerged PR code,
    # and a fork branch named release-plz-* would otherwise start the TVC
    # binaries workflow_run.
    if: >
      github.repository_owner == 'tkhq' &&
      github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # determine the next version and build the changelog.
          fetch-depth: 0
      - name: install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Run release-plz
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
