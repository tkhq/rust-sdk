[package]
name = "turnkey_http_authz"
version = "0.16.0"
edition = "2024"
license = "Apache-2.0"
description = "Verify Turnkey http-authz/v1 request-bound JWTs and bind them to the received HTTP request"
repository = "https://github.com/tkhq/rust-sdk"
homepage = "https://turnkey.com"
readme = "README.md"
documentation = "https://docs.rs/turnkey_http_authz"
keywords = ["turnkey", "jwt", "authorization", "http", "p256"]
categories = ["cryptography", "authentication", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The Axum route layer. Off, the crate has the verifier and the digest
# helpers only, and depends on `http` but not on Axum.
axum = ["dep:axum", "dep:tower", "dep:tracing"]

[dependencies]
base64.workspace = true
# The workspace `http` dependency is 0.2 (used by `turnkey_client`). This crate
# uses the 1.x types that hyper and Axum expose.
http = { version = "1.3", default-features = false, features = ["std"] }
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

axum = { version = "0.8", default-features = false, features = ["json", "original-uri"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true
rand_core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[[example]]
name = "verify_tokens"
path = "examples/verify_tokens.rs"
